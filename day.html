<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>問題を解く｜EBP統計トレーニング</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header compact-header">
  <div class="container">
    <p class="eyebrow">ICHIMIZU-KAI</p>
    <h1>EBP統計トレーニング</h1>
  </div>
</header>

<main class="container">
  <div class="day-nav">
    <a href="index.html">← Day一覧へ戻る</a>
    <button id="interruptButton" class="button secondary compact-button" type="button">中断する</button>
  </div>
  <section class="panel">
    <div id="dayHeader"></div>
    <div class="progress-bar"><div id="progressFill"></div></div>
    <p id="progressText" class="muted"></p>
  </section>

  <section class="panel" id="questionPanel">
    <div id="questionArea"></div>
  </section>

  <section class="panel hidden" id="resultPanel">
    <div id="resultArea"></div>
  </section>
</main>

<script src="js/day.js"></script>
</body>
</html>
